<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AHEAD CREATOR HUB Admin</title><style>body{margin:0;background:#080c15;color:#fff;font-family:system-ui,Arial}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #263149;padding-bottom:15px}.btn{padding:10px 13px;border-radius:10px;border:1px solid #30405e;background:#121a2a;color:#fff;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#7c5cff,#00cfff);border:0}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tab.active{outline:2px solid #7c5cff}.panel{display:none}.panel.active{display:block}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{font-size:12px;color:#aab7cc;display:block;margin-bottom:5px}.field input{width:100%;padding:11px;border-radius:9px;border:1px solid #30405e;background:#0d1421;color:#fff;box-sizing:border-box}.full{grid-column:1/-1}.list{display:grid;gap:10px;margin-top:15px}.item{border:1px solid #293653;background:#0e1524;border-radius:14px;padding:15px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#9ba7bf}.danger{background:#35141b;border-color:#69303b}.note{padding:12px;border:1px solid #30405e;border-radius:11px;color:#cbd8ea;background:#10192a}@media(max-width:650px){.form{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h2 style="margin:0">⚙️ AHEAD CREATOR HUB</h2><span class="muted">Admin Panel</span></div><div><a class="btn" href="index.html">View Website</a> <button class="btn" onclick="exportData()">Export</button></div></div><p class="note">V7 is a static prototype: data is stored in this browser. Secure multi-user database/admin authentication is a separate production step.</p><div class="tabs"><button class="btn tab active" data-p="services">Services</button><button class="btn tab" data-p="tutorials">Tutorials</button><button class="btn tab" data-p="communities">WhatsApp / Telegram</button><button class="btn tab" data-p="socials">Social Links</button><button class="btn tab" data-p="members">Members</button></div><div id="services" class="panel active"><h2>Services</h2><div class="form"><div class="field"><label>Icon</label><input id="si" value="🎬"></div><div class="field"><label>Name</label><input id="sn"></div><div class="field full"><label>Description</label><input id="sd"></div><div class="field full"><label>Link (https://... or #section)</label><input id="su"></div><button class="btn primary full" onclick="add('services',[si.value,sn.value,sd.value,su.value])">Add Service</button></div><div id="sl" class="list"></div></div><div id="tutorials" class="panel"><h2>Tutorials</h2><div class="form"><div class="field"><label>Icon</label><input id="ti" value="📚"></div><div class="field"><label>Title</label><input id="tn"></div><div class="field full"><label>Description</label><input id="td"></div><button class="btn primary full" onclick="add('tutorials',[ti.value,tn.value,td.value])">Add Tutorial</button></div><div id="tl" class="list"></div></div><div id="communities" class="panel"><h2>WhatsApp / Telegram</h2><div class="form"><div class="field"><label>Icon</label><input id="ci" value="💬"></div><div class="field"><label>Name</label><input id="cn"></div><div class="field full"><label>Description</label><input id="cd"></div><div class="field full"><label>Direct URL</label><input id="cu" placeholder="https://chat.whatsapp.com/... or https://t.me/..." ></div><button class="btn primary full" onclick="add('communities',[ci.value,cn.value,cd.value,cu.value])">Add Community</button></div><div id="cl" class="list"></div></div><div id="socials" class="panel"><h2>Social Links</h2><div class="form"><div class="field"><label>Icon</label><input id="oi" value="🔗"></div><div class="field"><label>Name</label><input id="on"></div><div class="field full"><label>Direct URL</label><input id="ou" placeholder="https://..."></div><button class="btn primary full" onclick="add('socials',[oi.value,on.value,ou.value])">Add Social Link</button></div><div id="ol" class="list"></div></div><div id="members" class="panel"><h2>Members on this browser</h2><div id="ml" class="list"></div></div></div><script>
const key='ach_v7_data';
const defaults={services:[['🎬','Video Creation','Plan, record and create better videos.','#tutorials'],['📘','Facebook Growth','Reels, pages and audience growth.','#tutorials'],['▶️','YouTube Growth','Titles, thumbnails, Shorts and retention.','#tutorials'],['🎵','TikTok Growth','Hooks, trends and posting strategy.','#tutorials'],['📸','Instagram Growth','Reels, profile and content strategy.','#tutorials'],['#️⃣','Hashtag Strategy','Build a relevant hashtag approach.','#tools'],['🪝','Viral Hooks','Create stronger opening lines.','#tools'],['🖼️','Thumbnail Creation','Make clear, focused thumbnails.','#tutorials'],['✂️','Video Editing','Learn simple mobile editing workflows.','#tutorials'],['🤖','AI Video Creation','Use AI for ideas, scripts and visuals.','#tools'],['💰','Monetization','Understand creator monetization basics.','#tutorials'],['📊','Analytics','Understand reach, views and retention.','#tutorials']],tutorials:[['🎯','How to Make a Strong Hook','Give viewers a reason to keep watching.'],['#️⃣','Hashtag Strategy','Choose relevant tags with a clear purpose.'],['🖼️','Thumbnail Basics','Make thumbnails easy to understand at a glance.'],['📊','Understanding Analytics','Learn what important numbers mean.']],communities:[['💬','WhatsApp Community','Contact / join via WhatsApp.','https://wa.me/8801400524877'],['✈️','Telegram Group','NEW MEMBER GROUP META PRO SPACE','https://t.me/Aheadviaiskill_hab'],['✈️','Telegram Channel','AHEAD VIA FREE ONLINE INCOME SERVICE','https://t.me/Aheadvia1298gf']],socials:[['📘','Facebook','https://www.facebook.com/share/1CMGNZk1J6/'],['▶️','YouTube','https://www.youtube.com/@KittySnipsStories'],['🎵','TikTok','https://tiktok.com/@abdulahead121'],['✈️','Telegram','https://t.me/Aheadvia1298'],['💬','WhatsApp','https://wa.me/8801400524877'],['📞','Contact','tel:+8801335611366']]};
let d=JSON.parse(localStorage.getItem(key)||'null')||defaults; const $=x=>document.getElementById(x),sl=$('sl'),tl=$('tl'),cl=$('cl'),ol=$('ol'),ml=$('ml');
const esc=x=>String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m])); const link=u=>/^https?:\/\//i.test(u)?u:'https://'+u;
function save(){localStorage.setItem(key,JSON.stringify(d))} function add(t,x){if(!x[1])return alert('Name/title is required');d[t].push(x);save();render()} function del(t,i){if(confirm('Delete this item?')){d[t].splice(i,1);save();render()}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.p).classList.add('active')});
function editItem(t,i){const x=d[t][i];const vals=x.map(v=>prompt('Edit value',v));if(vals.some(v=>v===null))return;d[t][i]=vals;save();render()}
function render(){sl.innerHTML=d.services.map((x,i)=>`<div class=item><div class=row><b>${esc(x[0])} ${esc(x[1])}</b><button class="btn danger" onclick="del('services',${i})">Delete</button></div><div class=muted>${esc(x[2])}</div><div class=muted>${esc(x[3])}</div></div>`).join('');tl.innerHTML=d.tutorials.map((x,i)=>`<div class=item><div class=row><b>${esc(x[0])} ${esc(x[1])}</b><button class="btn danger" onclick="del('tutorials',${i})">Delete</button></div><div class=muted>${esc(x[2])}</div></div>`).join('');cl.innerHTML=d.communities.map((x,i)=>`<div class=item><div class=row><b>${esc(x[0])} ${esc(x[1])}</b><button class="btn danger" onclick="del('communities',${i})">Delete</button></div><div class=muted>${esc(x[2])}</div><p><a class="btn primary" href="${link(x[3])}" target="_blank" rel="noopener">Test / Open</a></p></div>`).join('');ol.innerHTML=d.socials.map((x,i)=>`<div class=item><div class=row><b>${esc(x[0])} ${esc(x[1])}</b><button class="btn danger" onclick="del('socials',${i})">Delete</button></div><div class=muted>${esc(x[2])}</div><p><a class="btn primary" href="${link(x[2])}" target="_blank" rel="noopener">Test / Open</a></p></div>`).join('');const u=JSON.parse(localStorage.getItem('ach_v7_user')||'null');ml.innerHTML=u?`<div class=item><b>${esc(u.name)}</b><div class=muted>ID: ${esc(u.id)}</div><div class=muted>${esc(u.email)} · ${esc(u.country)}</div></div>`:'<div class="note">No member on this browser.</div>'}
function exportData(){const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ahead-creator-hub-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.services||!x.tutorials||!x.communities||!x.socials)throw Error();d=x;save();render();alert('Data imported successfully.')}catch(e){alert('Invalid data file.')}};r.readAsText(f)};inp.click()}
render();
</script></body></html>
